# IT2-FLS Parameters - Transient Disturbance Rejection
#
# DESIGN PHILOSOPHY:
# - PID handles steady-state errors (integral term)
# - Fuzzy handles TRANSIENT disturbances (gusts, sudden changes)
# - Focus on dError (error rate) rather than wind feedforward
# - Avoid conflicting with PID's integral action
#
# Author: Multi-Agent Formation Control Research
# Date: 2026-01-04

membership_functions:
  # Error: ±2.0m range (matches observed simulation errors)
  error:
    NB: [-2.0, -1.6, -1.2, -2.2, -1.7, -1.1]
    NS: [-1.4, -0.8, -0.2, -1.6, -0.9, 0.0]
    ZE: [-0.3, 0.0, 0.3, -0.4, 0.0, 0.4]
    PS: [0.2, 0.8, 1.4, 0.0, 0.9, 1.6]
    PB: [1.2, 1.6, 2.0, 1.1, 1.7, 2.2]

  # dError: ±1.0 m/s - CRITICAL for transient detection
  # Fast error changes indicate disturbance
  dError:
    DN: [-1.0, -0.6, 0.0, -1.2, -0.7, 0.1]      # Error decreasing fast
    DZ: [-0.2, 0.0, 0.2, -0.3, 0.0, 0.3]        # Stable
    DP: [0.0, 0.6, 1.0, -0.1, 0.7, 1.2]         # Error increasing fast (DISTURBANCE!)

  # Wind: Used for context, not direct feedforward
  # Helps distinguish wind-caused transients from other sources
  wind:
    LOW:  [0.0, 0.0, 1.5, 0.0, 0.0, 2.0]        # Calm (0-1.5 m/s)
    MED:  [1.0, 2.5, 4.0, 0.5, 2.5, 4.5]        # Moderate (1-4 m/s)
    HIGH: [3.0, 4.5, 6.0, 2.5, 5.0, 6.5]        # Strong (3+ m/s)

  # Correction: Transient boost (adds to PID)
  correction:
    LNC: [-4.0, -3.0, -2.0, -4.5, -3.25, -1.5]  # Large negative
    SNC: [-2.5, -1.5, -0.5, -3.0, -1.75, 0.0]   # Small negative
    NC:  [-0.5, 0.0, 0.5, -0.8, 0.0, 0.8]       # No correction
    SPC: [0.5, 1.5, 2.5, 0.0, 1.75, 3.0]        # Small positive
    LPC: [2.0, 3.0, 4.0, 1.5, 3.25, 4.5]        # Large positive

# Rules: Focus on ERROR DYNAMICS, not steady-state
# Key insight: Fast error increase (DP) = disturbance hitting = boost correction
rules:
  # === CALM CONDITIONS (LOW wind) ===
  # Standard PD-like response, minimal intervention
  - [PB, DZ, LOW, SPC]    # Large error, stable -> small boost
  - [PS, DZ, LOW, NC]     # Small error, stable -> let PID handle
  - [ZE, DZ, LOW, NC]     # On target -> no action
  - [NS, DZ, LOW, NC]
  - [NB, DZ, LOW, SNC]

  # Error decreasing (system recovering) -> reduce action, avoid overshoot
  - [PB, DN, LOW, NC]     # Error shrinking fast -> ease off
  - [PS, DN, LOW, NC]
  - [ZE, DN, LOW, SNC]    # Approaching target fast -> brake
  - [NS, DN, LOW, NC]
  - [NB, DN, LOW, NC]

  # Error increasing (disturbance!) -> BOOST correction
  - [PB, DP, LOW, LPC]    # Error growing -> strong response
  - [PS, DP, LOW, SPC]
  - [ZE, DP, LOW, SPC]    # Was stable, now drifting -> act early
  - [NS, DP, LOW, SNC]
  - [NB, DP, LOW, LNC]

  # === MODERATE WIND (MED) ===
  # More aggressive on transients
  - [PB, DZ, MED, SPC]
  - [PS, DZ, MED, NC]
  - [ZE, DZ, MED, NC]     # Steady wind, steady error -> PID handles
  - [NS, DZ, MED, NC]
  - [NB, DZ, MED, SNC]

  - [PB, DN, MED, NC]
  - [PS, DN, MED, NC]
  - [ZE, DN, MED, SNC]
  - [NS, DN, MED, NC]
  - [NB, DN, MED, NC]

  - [PB, DP, MED, LPC]    # Gust hitting -> strong response
  - [PS, DP, MED, LPC]
  - [ZE, DP, MED, SPC]
  - [NS, DP, MED, SNC]
  - [NB, DP, MED, LNC]

  # === STRONG WIND (HIGH) ===
  # Maximum transient response, trust PID for steady-state
  - [PB, DZ, HIGH, SPC]   # Steady under strong wind -> small boost
  - [PS, DZ, HIGH, NC]
  - [ZE, DZ, HIGH, NC]    # Stabilized -> don't fight PID
  - [NS, DZ, HIGH, NC]
  - [NB, DZ, HIGH, SNC]

  - [PB, DN, HIGH, NC]    # Recovering -> let it settle
  - [PS, DN, HIGH, NC]
  - [ZE, DN, HIGH, SNC]
  - [NS, DN, HIGH, NC]
  - [NB, DN, HIGH, NC]

  - [PB, DP, HIGH, LPC]   # Strong gust on top of wind -> MAX response
  - [PS, DP, HIGH, LPC]
  - [ZE, DP, HIGH, LPC]   # Sudden disturbance -> immediate action
  - [NS, DP, HIGH, LNC]
  - [NB, DP, HIGH, LNC]
