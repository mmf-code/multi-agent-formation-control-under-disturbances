# IT2-FLS Parameters - Transient Disturbance Rejection
#
# DESIGN PHILOSOPHY:
# - PID handles steady-state errors (integral term)
# - Fuzzy handles TRANSIENT disturbances (gusts, sudden changes)
# - Focus on dError (error rate) rather than wind feedforward
# - Avoid conflicting with PID's integral action
#
# Author: Multi-Agent Formation Control Research
# Date: 2026-01-04

membership_functions:
  # Error: ±5.0m range (EXPANDED for strong wind scenarios)
  # Allows fuzzy to respond to large errors from wind disturbance
  error:
    NB: [-5.0, -4.0, -2.5, -5.5, -4.25, -2.0]   # Very negative error
    NS: [-3.0, -1.5, -0.3, -3.5, -1.75, 0.0]    # Small negative error
    ZE: [-0.5, 0.0, 0.5, -0.7, 0.0, 0.7]        # Near target
    PS: [0.3, 1.5, 3.0, 0.0, 1.75, 3.5]         # Small positive error
    PB: [2.5, 4.0, 5.0, 2.0, 4.25, 5.5]         # Very positive error

  # dError: ±2.0 m/s (EXPANDED for fast transients)
  # Larger range to detect aggressive wind changes
  dError:
    DN: [-2.0, -1.2, 0.0, -2.5, -1.4, 0.2]      # Error decreasing fast
    DZ: [-0.4, 0.0, 0.4, -0.6, 0.0, 0.6]        # Stable
    DP: [0.0, 1.2, 2.0, -0.2, 1.4, 2.5]         # Error increasing fast (DISTURBANCE!)

  # Wind: Expanded range for stronger winds
  wind:
    LOW:  [0.0, 0.0, 2.0, 0.0, 0.0, 2.5]        # Calm (0-2 m/s)
    MED:  [1.5, 3.5, 5.5, 1.0, 3.5, 6.0]        # Moderate (1.5-5.5 m/s)
    HIGH: [4.5, 6.0, 8.0, 4.0, 6.5, 9.0]        # Strong (4.5+ m/s)

  # Correction: Balanced output (±4 m/s² range)
  # Strong but safe corrections for wind disturbance
  correction:
    LNC: [-4.0, -3.0, -1.5, -4.5, -3.25, -1.0]  # Large negative
    SNC: [-2.5, -1.5, -0.3, -3.0, -1.75, 0.0]   # Small negative
    NC:  [-0.3, 0.0, 0.3, -0.5, 0.0, 0.5]       # No correction
    SPC: [0.3, 1.5, 2.5, 0.0, 1.75, 3.0]        # Small positive
    LPC: [1.5, 3.0, 4.0, 1.0, 3.25, 4.5]        # Large positive

# Rules: AGGRESSIVE ERROR COMPENSATION for video demo
# Key change: Large errors get LARGE correction regardless of dError state
# This makes fuzzy actively fight wind disturbance, not just transients
rules:
  # === CALM CONDITIONS (LOW wind) ===
  # Standard response with error-proportional correction
  - [PB, DZ, LOW, LPC]    # Large error -> LARGE correction (not small!)
  - [PS, DZ, LOW, SPC]    # Small error -> small correction
  - [ZE, DZ, LOW, NC]     # On target -> no action
  - [NS, DZ, LOW, SNC]
  - [NB, DZ, LOW, LNC]

  # Error decreasing (system recovering) -> maintain some correction
  - [PB, DN, LOW, SPC]    # Still large error -> keep pushing
  - [PS, DN, LOW, NC]
  - [ZE, DN, LOW, SNC]    # Approaching target fast -> brake
  - [NS, DN, LOW, NC]
  - [NB, DN, LOW, SNC]

  # Error increasing (disturbance!) -> MAXIMUM correction
  - [PB, DP, LOW, LPC]    # Error growing -> strong response
  - [PS, DP, LOW, LPC]    # Even small error growing -> act!
  - [ZE, DP, LOW, SPC]    # Was stable, now drifting -> act early
  - [NS, DP, LOW, SNC]
  - [NB, DP, LOW, LNC]

  # === MODERATE WIND (MED) ===
  # Aggressive steady-state AND transient compensation
  - [PB, DZ, MED, LPC]    # Large error in wind -> LARGE correction
  - [PS, DZ, MED, SPC]    # Small error in wind -> small correction
  - [ZE, DZ, MED, NC]     # Steady -> no extra action
  - [NS, DZ, MED, SNC]
  - [NB, DZ, MED, LNC]

  - [PB, DN, MED, SPC]    # Recovering but still error -> maintain
  - [PS, DN, MED, NC]
  - [ZE, DN, MED, SNC]
  - [NS, DN, MED, NC]
  - [NB, DN, MED, SNC]

  - [PB, DP, MED, LPC]    # Gust hitting -> MAX response
  - [PS, DP, MED, LPC]
  - [ZE, DP, MED, SPC]
  - [NS, DP, MED, SNC]
  - [NB, DP, MED, LNC]

  # === STRONG WIND (HIGH) ===
  # MAXIMUM compensation - fuzzy MUST help against strong wind
  - [PB, DZ, HIGH, LPC]   # Large error + strong wind -> MAX correction!
  - [PS, DZ, HIGH, SPC]   # Small error -> proportional
  - [ZE, DZ, HIGH, NC]    # Stabilized -> maintain
  - [NS, DZ, HIGH, SNC]
  - [NB, DZ, HIGH, LNC]

  - [PB, DN, HIGH, LPC]   # Recovering but wind strong -> keep pushing
  - [PS, DN, HIGH, SPC]
  - [ZE, DN, HIGH, NC]
  - [NS, DN, HIGH, SNC]
  - [NB, DN, HIGH, LNC]

  - [PB, DP, HIGH, LPC]   # Strong gust on top of wind -> MAX response
  - [PS, DP, HIGH, LPC]
  - [ZE, DP, HIGH, LPC]   # Sudden disturbance -> immediate action
  - [NS, DP, HIGH, LNC]
  - [NB, DP, HIGH, LNC]
