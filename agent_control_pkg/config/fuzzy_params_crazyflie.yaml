# Crazyflie-scaled IT2-FLS Parameters
#
# Original MFs were designed for ±10m error range (heavy drone)
# This version is scaled for Crazyflie's tighter control (~±0.5m errors)
#
# Scale factor: 20x reduction for error/dError universes
# Result: Fuzzy activates at smaller errors, providing adaptive control
#
# Author: Dr. Nova (Control Engineer Agent)
# Date: 2025-12-09

membership_functions:
  # Error: Scaled from ±10m to ±0.5m (20x reduction)
  # Now responds to position errors in 5-50cm range
  error:
    NB: [-0.50, -0.40, -0.30, -0.55, -0.425, -0.275]   # Large negative: -50cm to -30cm
    NS: [-0.35, -0.20, -0.05, -0.40, -0.225, 0.0]      # Small negative: -35cm to -5cm
    ZE: [-0.05, 0.0, 0.05, -0.10, 0.0, 0.10]           # Zero: ±5cm (tight)
    PS: [0.05, 0.20, 0.35, 0.0, 0.225, 0.40]           # Small positive: 5cm to 35cm
    PB: [0.30, 0.40, 0.50, 0.275, 0.425, 0.55]         # Large positive: 30cm to 50cm

  # dError (velocity error): Scaled from ±5 m/s to ±0.5 m/s (10x reduction)
  # Crazyflie moves slower, so error rate is also smaller
  dError:
    DN: [-0.50, -0.30, 0.0, -0.60, -0.35, 0.10]        # Decreasing error
    DZ: [-0.10, 0.0, 0.10, -0.15, 0.0, 0.15]           # Zero change
    DP: [0.0, 0.30, 0.50, -0.10, 0.30, 0.60]           # Increasing error

  # Wind: Keep original scale (m/s) - wind doesn't depend on drone size
  # But scale output to match controller output range
  wind:
    SNW: [-10.0, -8.0, -5.0, -11.0, -8.5, -4.5]        # Strong negative wind
    WNW: [-7.0, -4.0, -1.0, -8.0, -4.5, 0.0]           # Weak negative wind
    NWN: [-1.0, 0.0, 1.0, -1.5, 0.0, 1.5]              # No wind
    WPW: [1.0, 4.0, 7.0, 0.0, 4.5, 8.0]                # Weak positive wind
    SPW: [6.0, 8.0, 10.0, 5.5, 8.5, 11.0]              # Strong positive wind

  # Correction: Scaled output for Crazyflie acceleration range (±5 m/s²)
  # Original was ±4 m/s², increase slightly for responsiveness
  correction:
    XLNC: [-5.0, -4.0, -3.0, -5.5, -4.25, -2.5]        # Extra large negative
    LNC: [-3.5, -2.5, -1.5, -4.0, -2.75, -1.0]         # Large negative
    SNC: [-2.0, -1.0, 0.0, -2.5, -1.0, 0.5]            # Small negative
    NC: [-0.5, 0.0, 0.5, -1.0, 0.0, 1.0]               # No correction
    SPC: [0.0, 1.0, 2.0, -0.5, 1.0, 2.5]               # Small positive
    LPC: [1.5, 2.5, 3.5, 1.0, 2.75, 4.0]               # Large positive
    XLPC: [3.0, 4.0, 5.0, 2.5, 4.25, 5.5]              # Extra large positive

# Rules: Same logic, but now triggers at smaller errors
# Format: [error_mf, derror_mf, wind_mf, correction_mf]
rules:
  - [PB, DZ, NWN, LPC]
  - [PS, DZ, NWN, SPC]
  - [ZE, DZ, NWN, NC]
  - [NS, DZ, NWN, SNC]
  - [NB, DZ, NWN, LNC]
  - [PB, DN, NWN, LPC]
  - [PS, DN, NWN, SPC]
  - [ZE, DN, NWN, SNC]
  - [NS, DN, NWN, NC]
  - [NB, DN, NWN, SNC]
  - [PB, DP, NWN, NC]
  - [PS, DP, NWN, SNC]
  - [ZE, DP, NWN, SPC]
  - [NS, DP, NWN, SNC]
  - [NB, DP, NWN, LNC]
  - [ZE, DZ, SPW, LNC]
  - [ZE, DZ, SNW, LPC]
  - [ZE, DZ, WPW, SNC]
  - [ZE, DZ, WNW, SPC]
  - [PB, DZ, SPW, XLPC]
  - [NB, DZ, SNW, XLNC]
