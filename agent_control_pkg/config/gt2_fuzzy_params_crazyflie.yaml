# GT2-FLS Parameters - Transient Disturbance Rejection
#
# DESIGN PHILOSOPHY:
# - PID handles steady-state errors (integral term)
# - GT2-Fuzzy handles TRANSIENT disturbances with uncertainty modeling
# - Alpha-plane decomposition provides robust output under uncertainty
# - Focus on dError dynamics, not wind feedforward
#
# GT2 advantage: Better handling of uncertainty in disturbance magnitude
#
# Author: Multi-Agent Formation Control Research
# Date: 2026-01-04

membership_functions:
  # Error: ±2.0m range
  error:
    NB: [-2.0, -1.6, -1.2, -2.2, -1.7, -1.1]
    NS: [-1.4, -0.8, -0.2, -1.6, -0.9, 0.0]
    ZE: [-0.3, 0.0, 0.3, -0.4, 0.0, 0.4]
    PS: [0.2, 0.8, 1.4, 0.0, 0.9, 1.6]
    PB: [1.2, 1.6, 2.0, 1.1, 1.7, 2.2]

  # dError: 5 levels for finer transient detection
  # Key: DP/PB = disturbance hitting, DN/NB = recovering
  dError:
    NB: [-1.0, -0.8, -0.4, -1.2, -0.9, -0.3]    # Fast recovery
    NS: [-0.6, -0.3, 0.0, -0.7, -0.35, 0.05]    # Slow recovery
    ZE: [-0.15, 0.0, 0.15, -0.2, 0.0, 0.2]      # Stable
    PS: [0.0, 0.3, 0.6, -0.05, 0.35, 0.7]       # Slow drift
    PB: [0.4, 0.8, 1.0, 0.3, 0.9, 1.2]          # Fast drift (DISTURBANCE!)

  # Wind: Normalized [0, 1] - used for context only
  wind:
    LOW:    [0.0, 0.0, 0.3, 0.0, 0.0, 0.4]      # Calm
    MEDIUM: [0.2, 0.5, 0.8, 0.15, 0.5, 0.85]    # Moderate
    HIGH:   [0.6, 0.85, 1.0, 0.5, 0.9, 1.0]     # Strong

  # Correction: Transient boost
  correction:
    NB: [-4.0, -3.0, -2.0, -4.5, -3.25, -1.5]
    NS: [-2.5, -1.5, -0.3, -3.0, -1.75, 0.0]
    ZE: [-0.4, 0.0, 0.4, -0.6, 0.0, 0.6]
    PS: [0.3, 1.5, 2.5, 0.0, 1.75, 3.0]
    PB: [2.0, 3.0, 4.0, 1.5, 3.25, 4.5]

# Rules: 75 rules (5×5×3) - Focus on dError dynamics
rules:
  # ===== LOW WIND (25 rules) =====
  # Minimal intervention, let PID work
  - [NB, NB, LOW, ZE]     # Recovering fast -> ease off
  - [NB, NS, LOW, ZE]
  - [NB, ZE, LOW, NS]     # Stable error -> small correction
  - [NB, PS, LOW, NS]     # Starting to drift -> act
  - [NB, PB, LOW, NB]     # Disturbance! -> strong response

  - [NS, NB, LOW, ZE]
  - [NS, NS, LOW, ZE]
  - [NS, ZE, LOW, ZE]     # Let PID handle
  - [NS, PS, LOW, NS]
  - [NS, PB, LOW, NB]

  - [ZE, NB, LOW, PS]     # Overshooting -> brake
  - [ZE, NS, LOW, ZE]
  - [ZE, ZE, LOW, ZE]     # Perfect -> no action
  - [ZE, PS, LOW, ZE]
  - [ZE, PB, LOW, NS]     # Sudden drift -> counter

  - [PS, NB, LOW, PB]
  - [PS, NS, LOW, PS]
  - [PS, ZE, LOW, ZE]
  - [PS, PS, LOW, ZE]
  - [PS, PB, LOW, PS]

  - [PB, NB, LOW, PB]     # Recovering from disturbance
  - [PB, NS, LOW, ZE]
  - [PB, ZE, LOW, PS]
  - [PB, PS, LOW, PS]
  - [PB, PB, LOW, PB]     # Disturbance! -> strong

  # ===== MEDIUM WIND (25 rules) =====
  # More responsive to transients
  - [NB, NB, MEDIUM, ZE]
  - [NB, NS, MEDIUM, ZE]
  - [NB, ZE, MEDIUM, NS]
  - [NB, PS, MEDIUM, NB]  # Wind + drift -> act fast
  - [NB, PB, MEDIUM, NB]

  - [NS, NB, MEDIUM, ZE]
  - [NS, NS, MEDIUM, ZE]
  - [NS, ZE, MEDIUM, ZE]
  - [NS, PS, MEDIUM, NS]
  - [NS, PB, MEDIUM, NB]

  - [ZE, NB, MEDIUM, PS]
  - [ZE, NS, MEDIUM, ZE]
  - [ZE, ZE, MEDIUM, ZE]  # Stable in wind -> PID has it
  - [ZE, PS, MEDIUM, NS]
  - [ZE, PB, MEDIUM, NB]  # Gust! -> respond

  - [PS, NB, MEDIUM, PB]
  - [PS, NS, MEDIUM, PS]
  - [PS, ZE, MEDIUM, ZE]
  - [PS, PS, MEDIUM, PS]
  - [PS, PB, MEDIUM, PB]

  - [PB, NB, MEDIUM, PB]
  - [PB, NS, MEDIUM, PS]
  - [PB, ZE, MEDIUM, PS]
  - [PB, PS, MEDIUM, PB]
  - [PB, PB, MEDIUM, PB]

  # ===== HIGH WIND (25 rules) =====
  # Maximum transient response, trust PID for steady-state
  - [NB, NB, HIGH, ZE]    # Let recovery happen
  - [NB, NS, HIGH, ZE]
  - [NB, ZE, HIGH, NS]
  - [NB, PS, HIGH, NB]    # Gust on wind -> max response
  - [NB, PB, HIGH, NB]

  - [NS, NB, HIGH, PS]
  - [NS, NS, HIGH, ZE]
  - [NS, ZE, HIGH, ZE]
  - [NS, PS, HIGH, NB]
  - [NS, PB, HIGH, NB]

  - [ZE, NB, HIGH, PS]
  - [ZE, NS, HIGH, ZE]
  - [ZE, ZE, HIGH, ZE]    # Stable in strong wind -> don't fight PID
  - [ZE, PS, HIGH, NS]
  - [ZE, PB, HIGH, NB]    # Sudden gust -> immediate

  - [PS, NB, HIGH, PB]
  - [PS, NS, HIGH, PS]
  - [PS, ZE, HIGH, ZE]
  - [PS, PS, HIGH, PB]
  - [PS, PB, HIGH, PB]

  - [PB, NB, HIGH, PB]
  - [PB, NS, HIGH, PS]
  - [PB, ZE, HIGH, PS]
  - [PB, PS, HIGH, PB]
  - [PB, PB, HIGH, PB]    # Max error + gust -> max response
