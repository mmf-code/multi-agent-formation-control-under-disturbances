simulation_settings:
  dt: 0.01           # [s]
  total_time: 50.0   # [s]

physics:
  mass: 1.5          # [kg]
  cd_lin: 0.12       # linear drag [kg/s]
  cd_quad: 0.0       # quadratic drag [kg/m] (off for baseline)
  v_thr: 2.0         # speed threshold for blending [m/s]
  a_max: 12.0        # per-axis accel limit [m/s^2]
  tau_up: 0.08       # actuator time constant up [s]
  tau_down: 0.06     # actuator time constant down [s]

wind:
  vx: 0.0            # ambient wind velocity X [m/s]
  vy: 0.0            # ambient wind velocity Y [m/s]

target:
  x: 5.0             # step target X [m]
  y: 5.0             # step target Y [m]

controller_settings:
  pid:
    kp: 1.0
    ki: 0.10
    kd: 0.35
    enable_derivative_filter: true
