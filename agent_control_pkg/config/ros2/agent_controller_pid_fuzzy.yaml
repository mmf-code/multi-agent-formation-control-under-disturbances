# ROS2 Agent Controller Configuration - PID+FUZZY HYBRID
# Hybrid PID + GT2 Fuzzy Logic System (BEST WIND REJECTION)
# Combines PID baseline with fuzzy disturbance compensation
# Expected: Similar to PID but better wind/disturbance handling

agent_0:
  agent_controller:
    ros__parameters:
      # Controller type: pid_fuzzy (hybrid)
      controller_type: pid_fuzzy

      # Timing configuration
      dt: 0.005
      control_frequency_hz: 200.0

      # Output limits for acceleration commands (m/s²)
      output_limits.x.min: -10.0
      output_limits.x.max: 10.0
      output_limits.y.min: -8.0
      output_limits.y.max: 12.0

      # PID controller gains (from C++ run_088, proven wind performance)
      # Hybrid: PID provides baseline, Fuzzy adapts to disturbances
      pid.kp: 3.501        # Strong proportional (from velocity tuning)
      pid.ki: 1.946        # Integral action for steady-state
      pid.kd: 3.608        # Damping
      pid.enable_derivative_filter: true
      pid.derivative_filter_alpha: 0.1

      # Fuzzy logic controller (GT2-FLS for disturbance rejection)
      fuzzy.enable: true
      fuzzy.include_wind: true     # ENABLED for wind disturbance detection
      fuzzy.wind_scalar: 1.0       # Full wind input sensitivity
      fuzzy.params_file: fuzzy_params.yaml

      # Hybrid controller mixing (fuzzy compensates disturbances)
      mix.k_pid: 1.0       # PID contribution weight (baseline)
      mix.k_fuzzy: 0.7     # Fuzzy contribution weight (tuned for formation)

      # Diagnostics
      diagnostics.enable: true
