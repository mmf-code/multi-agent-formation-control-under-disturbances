# ROS2 Agent Controller Configuration
# Default configuration for Crazyflie 2.1 nano quadrotor
# Used by: agent_controller_node

# =============================================================================
# PHYSICAL MODEL: Crazyflie 2.1
# =============================================================================
# Mass: 27g (0.027 kg)
# Size: 92mm x 92mm motor-to-motor
# Max thrust: ~60g (0.6N)
# Reference: https://www.bitcraze.io/products/crazyflie-2-1/
# =============================================================================

agent_0:
  agent_controller:
    ros__parameters:
      # Controller type: pid, fuzzy, pid_fuzzy, p, pi, pd
      controller_type: pid

      # Timing configuration
      dt: 0.005
      control_frequency_hz: 200.0

      # Output limits for acceleration commands (m/s²)
      # Crazyflie max: ~22 m/s² (0.6N / 0.027kg), conservative limits used
      output_limits.x.min: -10.0
      output_limits.x.max: 10.0
      output_limits.y.min: -10.0
      output_limits.y.max: 10.0

      # PID controller gains
      # Design: G(s) = 1/s² (double integrator)
      # Target: ~15% overshoot, ~5s settling time
      # zeta = 0.933, omega_n = 0.733 rad/s
      pid.kp: 0.538
      pid.ki: 0.145
      pid.kd: 1.368
      pid.enable_derivative_filter: true
      pid.derivative_filter_alpha: 0.1
      pid.anti_windup_mode: "combined"  # none, conditional, back_calculation, combined
      pid.tracking_time_constant: 0.0   # 0 = auto-compute from Tt = sqrt(Ti*Td)

      # Fuzzy logic controller configuration (IT2 - Interval Type-2)
      fuzzy.enable: false
      fuzzy.include_wind: false
      fuzzy.wind_scalar: 0.0
      fuzzy.params_file: fuzzy_params.yaml

      # Hybrid controller mixing (only used if controller_type = pid_fuzzy)
      mix.k_pid: 1.0
      mix.k_fuzzy: 1.0

      # Wind input source configuration
      wind_source_topic: "/wind/velocity"
      wind_source_type: "velocity"  # "velocity" or "force"
      debug_wind_input: false

      # Data freshness / stale data protection
      stale_data.enable: true
      stale_data.odom_threshold_sec: 0.5    # Max age for odometry data
      stale_data.target_threshold_sec: 2.0  # Max age for target pose

      # Feed-forward control (drag and wind disturbance cancellation)
      # Parameters MUST match Gazebo model for accurate compensation
      feedforward.enable_drag: false
      feedforward.enable_wind: false
      feedforward.k_drag: 0.8         # Drag compensation gain (0.0 to 1.0+)
      feedforward.k_wind: 1.0         # Wind bias compensation gain
      # Crazyflie 2.1 physical parameters
      feedforward.mass_estimate: 0.027           # [kg] Crazyflie mass (27g)
      feedforward.drag_coeff_lin_estimate: 0.005 # [kg/s] Linear drag coefficient
      feedforward.drag_coeff_quad_estimate: 0.001 # [kg/m] Quadratic drag coefficient
      feedforward.drag_speed_threshold_estimate: 0.5 # [m/s] Drag model transition speed

      # Diagnostics
      diagnostics.enable: true
