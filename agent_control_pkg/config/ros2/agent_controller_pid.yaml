# ROS2 Agent Controller Configuration - FULL PID CONTROLLER
# Full Proportional-Integral-Derivative control (BALANCED PERFORMANCE)
# From successful multi-agent simulations: Kp=3.1, Ki=0.4, Kd=2.2
# Expected: Good balance (~4-5s), minimal overshoot, no steady-state error

agent_0:
  agent_controller:
    ros__parameters:
      # Controller type: pid (full PID)
      controller_type: pid

      # Timing configuration
      dt: 0.005
      control_frequency_hz: 200.0

      # Output limits for acceleration commands (m/s²)
      output_limits.x.min: -10.0
      output_limits.x.max: 10.0
      output_limits.y.min: -8.0
      output_limits.y.max: 12.0

      # PID controller gains (optimized from C++ simulation run_088 basis)
      # Expected: Better wind rejection than PD, balanced performance
      pid.kp: 3.501        # Proportional gain (from velocity-based tuning)
      pid.ki: 1.946        # Integral gain (handles persistent disturbances)
      pid.kd: 3.608        # Derivative gain (damping)
      pid.enable_derivative_filter: true
      pid.derivative_filter_alpha: 0.1

      # Fuzzy logic controller (disabled for pure PID)
      fuzzy.enable: false
      fuzzy.include_wind: false
      fuzzy.wind_scalar: 0.0
      fuzzy.params_file: fuzzy_params.yaml

      # Hybrid controller mixing (not used)
      mix.k_pid: 1.0
      mix.k_fuzzy: 1.0

      # Diagnostics
      diagnostics.enable: true
