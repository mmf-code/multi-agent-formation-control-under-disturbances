# ROS2 Agent Controller Configuration - FULL PID CONTROLLER
# Full Proportional-Integral-Derivative control (BALANCED PERFORMANCE)
# From successful multi-agent simulations: Kp=3.1, Ki=0.4, Kd=2.2
# Expected: Good balance (~4-5s), minimal overshoot, no steady-state error

agent_0:
  agent_controller:
    ros__parameters:
      # Controller type: pid (full PID)
      controller_type: pid

      # Timing configuration
      dt: 0.005
      control_frequency_hz: 200.0

      # Output limits for acceleration commands (m/s²)
      output_limits.x.min: -10.0
      output_limits.x.max: 10.0
      output_limits.y.min: -8.0
      output_limits.y.max: 12.0

      # PID controller gains (TUNED FOR FASTER RESPONSE)
      # Increased gains for more aggressive tracking
      # Expected: Faster settling, better tracking, maintained stability
      pid.kp: 5.0          # Increased proportional (43% faster response)
      pid.ki: 2.5          # Increased integral (faster steady-state correction)
      pid.kd: 5.0          # Increased derivative (maintained damping ratio)
      pid.enable_derivative_filter: true
      pid.derivative_filter_alpha: 0.1

      # Fuzzy logic controller (disabled for pure PID)
      fuzzy.enable: false
      fuzzy.include_wind: false
      fuzzy.wind_scalar: 0.0
      fuzzy.params_file: fuzzy_params.yaml

      # Hybrid controller mixing (not used)
      mix.k_pid: 1.0
      mix.k_fuzzy: 1.0

      # Feed-forward control (drag and wind disturbance cancellation)
      feedforward.enable_drag: false
      feedforward.enable_wind: false
      feedforward.k_drag: 0.8         # Drag compensation gain (0.0 to 1.0+)
      feedforward.k_wind: 1.0         # Wind bias compensation gain
      feedforward.mass_estimate: 1.5  # Must match Gazebo model mass
      feedforward.drag_coeff_lin_estimate: 0.12
      feedforward.drag_coeff_quad_estimate: 0.05
      feedforward.drag_speed_threshold_estimate: 1.0

      # Diagnostics
      diagnostics.enable: true
