# ROS2 Agent Controller Configuration - P ONLY
# Proportional control only (baseline for comparison)
# Expected: Slow response, steady-state error, no overshoot

agent_0:
  agent_controller:
    ros__parameters:
      # Controller type: p (proportional only)
      controller_type: p

      # Timing configuration
      dt: 0.005
      control_frequency_hz: 200.0

      # Output limits for acceleration commands (m/s²)
      output_limits.x.min: -10.0
      output_limits.x.max: 10.0
      output_limits.y.min: -8.0
      output_limits.y.max: 12.0

      # P-only controller gains
      pid.kp: 0.538        # Baseline proportional gain
      pid.ki: 0.0          # DISABLED (no integral action)
      pid.kd: 0.0          # DISABLED (no derivative action)
      pid.enable_derivative_filter: false
      pid.derivative_filter_alpha: 0.1

      # Fuzzy logic controller (disabled for P-only)
      fuzzy.enable: false
      fuzzy.include_wind: false
      fuzzy.wind_scalar: 0.0
      fuzzy.params_file: fuzzy_params.yaml

      # Hybrid controller mixing (not used)
      mix.k_pid: 1.0
      mix.k_fuzzy: 1.0

      # Diagnostics
      diagnostics.enable: true
