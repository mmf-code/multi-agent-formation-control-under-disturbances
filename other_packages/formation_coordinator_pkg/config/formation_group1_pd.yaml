/formation_1/formation_coordinator_group1:
  ros__parameters:
    # GROUP 1: PD Controllers
    # Agents: agent_3, agent_4, agent_5
    # Color: Red, Green, Blue
    agent_ids:
      - agent_3
      - agent_4
      - agent_5

    # Formation shape: triangle
    formation.shape: triangle

    # Spacing between agents (meters) - INCREASED for collision avoidance
    formation.spacing: 3.0

    # Formation center position (target for group centroid)
    formation.center.x: 5.0
    formation.center.y: 0.0
    formation.center.z: 4.0  # FIXED: Match drone spawn altitude (Group 1 at Z=4.0m)

    # Formation orientation (degrees)
    formation.yaw_deg: 0.0

    # Reference frame
    frame_id: odom

    # Update rate (Hz)
    publish_frequency_hz: 10.0

    # PSO parameters for formation optimization
    pso.enable: true
    pso.num_particles: 20
    pso.max_iterations: 50
    pso.inertia_weight: 0.7
    pso.cognitive_coeff: 1.5
    pso.social_coeff: 1.5

    # Center motion along X (ramp from start_x to end_x)
    motion.enable: true
    motion.vx: 0.8
    motion.start_x: -8.5  # FIXED: Match actual centroid of Group 1 spawn positions (-10, -7, -8.5)
    motion.end_x: 5.0
