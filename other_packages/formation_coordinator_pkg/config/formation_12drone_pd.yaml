/formation_0/formation_coordinator_pd:
  ros__parameters:
    # GROUP 0: PD Controllers (Proportional-Derivative only)
    # 3 agents for 4-group comparison
    agent_ids:
      - agent_0
      - agent_1
      - agent_2

    # Formation shape: triangle (3 drones)
    formation.shape: triangle
    formation.spacing: 3.0

    # Formation center position
    formation.center.x: 0.0
    formation.center.y: -12.0
    formation.center.z: 0.5
    formation.yaw_deg: 0.0
    frame_id: odom

    # Update rate (Hz)
    publish_frequency_hz: 10.0

    # PSO parameters (disabled for deterministic results)
    pso.enable: false
    pso.num_particles: 20
    pso.max_iterations: 50
    pso.inertia_weight: 0.7
    pso.cognitive_coeff: 1.5
    pso.social_coeff: 1.5

    # Legacy motion (disabled)
    motion.enable: false
    motion.vx: 0.0

    # Waypoint trajectory (60s mission)
    waypoints.enable: true
    waypoints.times: [15.0, 30.0, 45.0, 60.0]
    waypoints.x: [-5.0, 0.0, 5.0, 5.0]
    waypoints.y: [-12.0, -12.0, -12.0, -12.0]
    waypoints.z: [0.5, 0.8, 0.8, 0.5]

    # Event-Triggered Communication (ETC)
    # Set etc.enable: false for event-triggered, false for time-triggered
    etc.enable: false
    etc.epsilon_pos: 0.05      # Position threshold [m]
    etc.min_period_sec: 0.02   # Anti-chattering [s]
    etc.max_period_sec: 0.5    # Heartbeat interval [s]
