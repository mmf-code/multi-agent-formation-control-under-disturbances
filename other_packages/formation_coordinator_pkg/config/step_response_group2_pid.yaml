/formation_2/formation_coordinator_group2:
  ros__parameters:
    # GROUP 2: PID Controllers - STEP RESPONSE TEST
    # Agents: agent_6, agent_7, agent_8
    # Fast step response scenario (60 seconds)
    agent_ids:
      - agent_6
      - agent_7
      - agent_8

    # Formation shape: triangle
    formation.shape: triangle

    # Spacing between agents (meters)
    formation.spacing: 3.0

    # Initial formation center position (northern lane, highest altitude)
    formation.center.x: -15.0
    formation.center.y: 5.0
    formation.center.z: 7.0

    # Formation orientation (degrees)
    formation.yaw_deg: 0.0

    # Reference frame
    frame_id: odom

    # Update rate (Hz)
    publish_frequency_hz: 10.0

    # PSO parameters (disabled for step response)
    pso.enable: false

    # MOTION DISABLED for multi-checkpoint step response
    motion.enable: false
    motion.vx: 0.0
    motion.start_x: 0.0
    motion.end_x: 0.0

    # 3D ZIGZAG TRAJECTORY WITH DISTURBANCES (5 waypoints, 4 maneuvers, 60s)
    # GROUP 2 (PID): HIGHEST ALTITUDE LANE (Z offset: +6.0m)
    waypoints.enable: true
    waypoints.times: [0.0, 15.0, 30.0, 45.0, 60.0]
    # Zigzag pattern: forward-left-up, forward-right-down, forward-left-up, forward-center
    waypoints.x: [-15.0, -10.0, -5.0, 0.0, 5.0]      # Forward progression
    waypoints.y: [5.0, 2.0, 5.0, 2.0, 3.5]           # Left-right zigzag (upper lane)
    waypoints.z: [7.0, 7.5, 7.0, 7.8, 7.5]           # Altitude variation (highest lane, +6m offset)

    # 3D ZIGZAG SCENARIO WITH PROGRESSIVE DISTURBANCES:
    # t=0-15s:  Checkpoint 1: Move left+up (X=-15→-10, Y=5→2, Z=1→1.5)
    #           Light disturbance (stabilization phase)
    # t=15-30s: Checkpoint 2: Move right+down (X=-10→-5, Y=2→5, Z=1.5→1)
    #           Medium disturbance (zigzag maneuver)
    # t=30-45s: Checkpoint 3: Move left+up (X=-5→0, Y=5→2, Z=1→1.8)
    #           Heavy disturbance (altitude change + lateral)
    # t=45-60s: Checkpoint 4: Stabilize center (X=0→5, Y=2→3.5, Z=1.8→1.5)
    #           Variable disturbance (final positioning under stress)
    # Each 15s interval allows settling before next challenging maneuver
