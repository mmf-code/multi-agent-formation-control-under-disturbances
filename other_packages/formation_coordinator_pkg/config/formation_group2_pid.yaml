/formation_2/formation_coordinator_group2:
  ros__parameters:
    # GROUP 2: PID Controllers
    # Agents: agent_6, agent_7, agent_8
    # Color: Orange, Purple, White
    agent_ids:
      - agent_6
      - agent_7
      - agent_8

    # Formation shape: triangle
    formation.shape: triangle

    # Spacing between agents (meters) - INCREASED for collision avoidance
    formation.spacing: 3.0  # Optimal spacing for triangle formation

    # Formation center position (initial target for group centroid)
    # Start at spawn centroid along X for step-wise trajectory.
    formation.center.x: -3.5
    formation.center.y: 15.0  # FAR RIGHT - prevent inter-group collision
    formation.center.z: 0.5  # EQUAL HEIGHT for fair wind comparison

    # Formation orientation (degrees)
    formation.yaw_deg: 0.0  # LOCKED - no rotation

    # Reference frame
    frame_id: odom

    # Update rate (Hz)
    publish_frequency_hz: 10.0

    # PSO parameters for formation optimization
    pso.enable: true  # ENABLED - optimize spacing only
    pso.num_particles: 20
    pso.max_iterations: 50
    pso.inertia_weight: 0.7
    pso.cognitive_coeff: 1.5
    pso.social_coeff: 1.5

    # Legacy linear motion along X (DISABLED - using waypoints instead)
    motion.enable: false
    motion.vx: 0.0
    motion.start_x: 0.0
    motion.end_x: 0.0

    # WAYPOINT-BASED 4-PHASE TRAJECTORY (≈110s demo with settle gaps)
    waypoints.enable: true

    # Same timing as other groups (move ~22s, hold ~5s per phase).
    waypoints.times: [22.0, 27.0, 49.0, 54.0, 76.0, 81.0, 103.0, 110.0]

    # X coordinates (P1..P4) for top lane (much longer travel)
    waypoints.x: [-2.0, -2.0, 6.0, 6.0, 14.0, 14.0, 22.0, 22.0]

    # Y/Z stay on the same altitude lane
    waypoints.y: [15.0, 15.0, 15.0, 15.0, 15.0, 15.0, 15.0, 15.0]
    waypoints.z: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
