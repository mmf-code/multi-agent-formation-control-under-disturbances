# VIDEO DEMO: Group 0 - PD Controllers
# Professional figure-8 trajectory with clear shape transitions
# Center: Y=-12, Duration: 120s

/formation_0/formation_coordinator_pd:
  ros__parameters:
    # GROUP 0: PD Controllers (3 agents)
    agent_ids:
      - agent_0
      - agent_1
      - agent_2

    # Formation shape
    formation.shape: triangle
    formation.spacing: 3.0

    # Formation center (spawn position)
    formation.center.x: 0.0
    formation.center.y: -12.0
    formation.center.z: 0.5
    formation.yaw_deg: 0.0
    frame_id: odom

    publish_frequency_hz: 5.0

    # PSO parameters
    pso.enable: false
    pso.num_particles: 20
    pso.max_iterations: 50
    pso.inertia_weight: 0.7
    pso.cognitive_coeff: 1.5
    pso.social_coeff: 1.5

    motion.enable: false

    # PROFESSIONAL FIGURE-8 TRAJECTORY (120s, 16 waypoints)
    # Larger radius (6m), clearer shape transitions, more dramatic movements
    #
    # Timeline:
    #   0-15s:   Assembly - hover at start
    #   15-30s:  Right loop (triangle formation)
    #   30-45s:  Cross center + shape transition to LINE
    #   45-60s:  Left loop (line formation)
    #   60-75s:  Cross center + shape transition to V_SHAPE
    #   75-90s:  Right loop (v_shape formation)
    #   90-105s: Cross center + shape transition to TRIANGLE
    #   105-120s: Return to start (triangle)

    waypoints.enable: true
    waypoints.times: [15.0, 22.5, 30.0, 37.5, 45.0, 52.5, 60.0, 67.5, 75.0, 82.5, 90.0, 97.5, 105.0, 112.5, 120.0]

    # Figure-8 with 6m radius loops
    # Right loop: center at (6, -12), Left loop: center at (-6, -12)
    waypoints.x: [0.0, 4.2, 6.0, 4.2, 0.0, -4.2, -6.0, -4.2, 0.0, 4.2, 6.0, 4.2, 0.0, 0.0, 0.0]
    waypoints.y: [-12.0, -7.8, -12.0, -16.2, -12.0, -16.2, -12.0, -7.8, -12.0, -7.8, -12.0, -16.2, -12.0, -12.0, -12.0]
    waypoints.z: [0.6, 0.8, 1.0, 0.8, 0.6, 0.8, 1.0, 0.8, 0.6, 0.8, 1.0, 0.8, 0.6, 0.5, 0.5]

    # Shape transitions: hold each shape for ~30s for visibility
    waypoints.shapes: [triangle, triangle, triangle, triangle, line, line, line, line, v_shape, v_shape, v_shape, v_shape, triangle, triangle, triangle]

    etc.enable: false
