# VIDEO DEMO: Group 3 - GT2 Fuzzy Controllers
# Professional figure-8 trajectory with clear shape transitions
# Center: Y=12, Duration: 120s

/formation_3/formation_coordinator_gt2:
  ros__parameters:
    # GROUP 3: GT2 Fuzzy Controllers (3 agents)
    agent_ids:
      - agent_9
      - agent_10
      - agent_11

    formation.shape: triangle
    formation.spacing: 3.0

    formation.center.x: 0.0
    formation.center.y: 12.0
    formation.center.z: 0.5
    formation.yaw_deg: 0.0
    frame_id: odom

    publish_frequency_hz: 5.0

    pso.enable: false
    pso.num_particles: 20
    pso.max_iterations: 50
    pso.inertia_weight: 0.7
    pso.cognitive_coeff: 1.5
    pso.social_coeff: 1.5

    motion.enable: false

    # SYNCHRONIZED with all groups - same pattern, different Y lane
    waypoints.enable: true
    waypoints.times: [15.0, 22.5, 30.0, 37.5, 45.0, 52.5, 60.0, 67.5, 75.0, 82.5, 90.0, 97.5, 105.0, 112.5, 120.0]

    waypoints.x: [0.0, 4.2, 6.0, 4.2, 0.0, -4.2, -6.0, -4.2, 0.0, 4.2, 6.0, 4.2, 0.0, 0.0, 0.0]
    waypoints.y: [12.0, 16.2, 12.0, 7.8, 12.0, 7.8, 12.0, 16.2, 12.0, 16.2, 12.0, 7.8, 12.0, 12.0, 12.0]
    waypoints.z: [0.6, 0.8, 1.0, 0.8, 0.6, 0.8, 1.0, 0.8, 0.6, 0.8, 1.0, 0.8, 0.6, 0.5, 0.5]

    waypoints.shapes: [triangle, triangle, triangle, triangle, line, line, line, line, v_shape, v_shape, v_shape, v_shape, triangle, triangle, triangle]

    etc.enable: false
