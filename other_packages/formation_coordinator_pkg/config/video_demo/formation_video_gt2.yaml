# VIDEO DEMO: Group 3 - GT2 Fuzzy Controllers
# Figure-8 trajectory with shape transitions (synchronized with other groups)
# Center: Y=12, Duration: 90s

/formation_3/formation_coordinator_gt2:
  ros__parameters:
    # GROUP 3: GT2 Fuzzy Controllers (3 agents)
    agent_ids:
      - agent_9
      - agent_10
      - agent_11

    # Formation shape: triangle (initial)
    formation.shape: triangle
    formation.spacing: 2.5

    # Formation center position (matches spawn)
    formation.center.x: 0.0
    formation.center.y: 12.0
    formation.center.z: 0.5
    formation.yaw_deg: 0.0
    frame_id: odom

    # Update rate (Hz)
    publish_frequency_hz: 10.0

    # PSO parameters
    pso.enable: true
    pso.num_particles: 20
    pso.max_iterations: 50
    pso.inertia_weight: 0.7
    pso.cognitive_coeff: 1.5
    pso.social_coeff: 1.5

    # Legacy motion (disabled)
    motion.enable: false

    # Figure-8 Trajectory - SYNCHRONIZED with all groups
    waypoints.enable: true
    waypoints.times: [10.0, 20.0, 27.5, 35.0, 42.5, 50.0, 57.5, 65.0, 72.5, 80.0, 85.0, 90.0]
    waypoints.x: [0.0, 0.0, 2.5, 3.0, 2.5, 0.0, -2.5, -3.0, -2.5, 0.0, 0.0, 0.0]
    waypoints.y: [12.0, 12.0, 14.0, 12.0, 10.0, 12.0, 10.0, 12.0, 14.0, 12.0, 12.0, 12.0]
    waypoints.z: [0.5, 0.7, 0.8, 0.9, 0.8, 0.7, 0.8, 0.9, 0.8, 0.7, 0.6, 0.5]
    waypoints.shapes: [triangle, triangle, triangle, line, line, v_shape, v_shape, line, line, triangle, triangle, triangle]

    # Event-Triggered Communication (ETC)
    etc.enable: false
