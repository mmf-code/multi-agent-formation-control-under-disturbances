/formation_0/formation_coordinator_group0:
  ros__parameters:
    agent_ids:
      - agent_0
      - agent_1
      - agent_2

    formation.shape: triangle
    formation.spacing: 3.0
    formation.center.x: 15.0
    formation.center.y: -4.0
    formation.center.z: 0.0
    formation.yaw_deg: 0.0

    frame_id: odom
