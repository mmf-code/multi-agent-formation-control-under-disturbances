# ROS2 Agent Controller Configuration - PI CONTROLLER
# Proportional-Integral control (no steady-state error)
# From successful run_076: Ts5=4.77s, OS=15.2%
# Expected: Moderate response (~5s), eliminates steady-state error

agent_0:
  agent_controller:
    ros__parameters:
      # Controller type: pi (proportional-integral)
      controller_type: pi

      # Timing configuration
      dt: 0.005
      control_frequency_hz: 200.0

      # Output limits for acceleration commands (m/s²)
      output_limits.x.min: -10.0
      output_limits.x.max: 10.0
      output_limits.y.min: -8.0
      output_limits.y.max: 12.0

      # PI controller gains (from C++ simulation run_076)
      pid.kp: 0.773        # Proportional gain (from run_076)
      pid.ki: 0.197        # Integral gain (from run_076)
      pid.kd: 0.0          # DISABLED (no derivative action)
      pid.enable_derivative_filter: false
      pid.derivative_filter_alpha: 0.1

      # Fuzzy logic controller (disabled for PI)
      fuzzy.enable: false
      fuzzy.include_wind: false
      fuzzy.wind_scalar: 0.0
      fuzzy.params_file: fuzzy_params.yaml

      # Hybrid controller mixing (not used)
      mix.k_pid: 1.0
      mix.k_fuzzy: 1.0

      # Diagnostics
      diagnostics.enable: true
